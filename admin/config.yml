backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "blog"
    label: "Blog Posts"
    folder: "posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title",       name: "title",       widget: "string" }
      - { label: "Publish Date", name: "date",        widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, default: "" }
      - { label: "Description", name: "description", widget: "string",   hint: "One-sentence summary shown in Google search results and on the blog listing page." }
      - { label: "Topic Tag",   name: "tag",         widget: "select",
          options: ["AI Training","AI Governance","Digital Transformation","AI Tools","Productivity","AI & Business"] }
      - { label: "Body",        name: "body",        widget: "markdown" }
